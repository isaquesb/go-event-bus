version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
      nats:
        patterns:
          - "github.com/nats-io/*"
